name: Test on various platforms CI

on:
  push:
    branches:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout meta_regex
        uses: actions/checkout@v4
        with:
          repository: lucas-mior/meta_regex
          path: meta_regex

      - name: Install build deps
        run: |
          xcode-select --install 2>/dev/null || true
          brew install libmagic pkgconf
          libmagic_prefix=$(brew --prefix libmagic)
          echo "PKG_CONFIG_PATH=${libmagic_prefix}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
              >> "$GITHUB_ENV"
          cc --version

      - name: Build and Test
        run: |
          ./build.sh build
          ./build.sh test

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout meta_regex
        uses: actions/checkout@v4
        with:
          repository: lucas-mior/meta_regex
          path: meta_regex

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev pkg-config
          cc --version

      - name: Build and Test
        run: |
          ./build.sh build
          ./build.sh test

  bsd:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }} VM
    timeout-minutes: 25
    defaults:
      run:
        shell: cpa.sh {0} --sync-files runner-to-vm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD
            os: freebsd
            version: "15.1"
          - name: OpenBSD
            os: openbsd
            version: "7.9"
          - name: NetBSD
            os: netbsd
            version: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout meta_regex
        uses: actions/checkout@v4
        with:
          repository: lucas-mior/meta_regex
          path: meta_regex

      - name: Start VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          shell: sh
          memory: 4G
          cpu_count: 2

      - name: Install build deps
        run: |
          case "$(uname -s)" in
          FreeBSD)
              sudo pkg install -y file pkgconf
              ;;
          OpenBSD)
              sudo pkg_add libmagic
              ;;
          NetBSD)
              sudo pkgin -y install file pkgconf
              ;;
          esac
          printf '%s\n' \
              '#include <magic.h>' \
              '' \
              'int main(void)' \
              '{' \
              '    return 0;' \
              '}' \
              > /tmp/check_magic.c
          cc /tmp/check_magic.c $(pkg-config --cflags --libs libmagic) \
              -o /tmp/check_magic
          /tmp/check_magic
          rm -f /tmp/check_magic /tmp/check_magic.c
          cc --version

      - name: Build and Test
        run: |
          ./build.sh build
          ./build.sh test
